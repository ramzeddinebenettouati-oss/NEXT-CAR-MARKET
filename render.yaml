# Render Blueprint — https://render.com/docs/blueprint-spec
# One always-on Node service runs the Express API, Socket.io and the built
# React frontend. Postgres and file storage live on Supabase.
services:
  - type: web
    name: next-car-market
    runtime: node
    # Socket.io needs an always-on instance (the free plan sleeps), and the
    # persistent disk below needs a paid plan.
    plan: starter
    # Pick the region closest to your Supabase project.
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: UPLOADS_DIR
        value: /var/data/uploads
      # Supabase → Connect → "Session pooler" URI, with
      # ?sslmode=require&uselibpqcompat=true appended.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      # Public URL of the site, used in e-mail links. Defaults to the
      # onrender.com URL; set it once you attach a custom domain.
      - key: APP_URL
        sync: false
      # Super admin created on first start of an empty database. Without the
      # password nothing is created. Ignored once a super admin exists.
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      # Supabase → Storage → S3 Connection
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: PRIVATE_OBJECT_DIR
        sync: false
      - key: PUBLIC_OBJECT_SEARCH_PATHS
        sync: false
      # Optional integrations — leave empty to disable
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
